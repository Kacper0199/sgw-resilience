# Hurricane Ian 2022 scenario pack (R34 B2, design R33 C3 step 2 option B): a scripted exercise on the real storm
# track. Only the track is real: NOAA NHC HURDAT2 best track AL092022 (public domain, US Government work), fixes
# from 28 Sep 00Z to 1 Oct 06Z, landfall near Georgetown, SC, 30 Sep 2022 18:05Z. No NHC cone archive is shipped
# offline for Ian, so the map draws the track only. Everything else here is SYNTHETIC and scripted for the
# exercise (D-065 names): the customers out per county, the critical facilities affected, the crew counts and the
# decisions of msel.yaml. Times are UTC.
