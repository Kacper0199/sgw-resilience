    known_at: "2024-09-27T09:00:00Z"
    resolved_at: "2024-09-27T18:00:00Z"
    anchor_utc: "2024-09-27T19:00:00Z"
    anchor_label: "Hollowpine plant line must be back before evening demand"
    lead_key: crew_staging_small
    if_late: "The Hollowpine plant line waits for crews that are still in Edgefield."
    rationale: "Richmond County has the Hollowpine plant line and 3,120 customers on FDR-RCH-1411 out. Three line crews from Kitefield yard reach Millpond yard in about 2 h."
  - id: EX-13-RESTORE-HOLLOWPINE-FIRST
    title: "Restore FDR-RCH-1406 (Hollowpine plant) before FDR-RCH-1411"
    action_type: cross_domain_priority
    step: D3
    domain: water
    region: GA-13245
    targets: [FDR-RCH-1406, FDR-RCH-1411]
    params: {first_id: FDR-RCH-1406, then_id: FDR-RCH-1411, facility_id: WTP-RCH-HOLLOWPINE, plant_generator_hours: 14}
    known_at: "2024-09-27T08:00:00Z"
    resolved_at: "2024-09-27T22:00:00Z"
    anchor_utc: "2024-09-27T22:00:00Z"
    anchor_label: "The plant's generator fuel runs out"
    lead_key: feeder_restoration_dispatch
    if_late: "Hollowpine stops treating water and 41,000 people lose tap water pressure."
    rationale: "Hollowpine runs on its generator with about 14 h of fuel. FDR-RCH-1406 (860 customers) feeds the plant; FDR-RCH-1411 has 3,120 customers but no critical load. Restoring the plant line first keeps water flowing for about 41,000 people."
  - id: EX-14-PATROL-THISTLECROFT
    title: "Patrol downed lines on the road to the Thistlecroft shelter"
    action_type: work_order_draft
    step: D2
    domain: electric
    region: SC-45003
    targets: [SHL-AIK-THISTLECROFT]
