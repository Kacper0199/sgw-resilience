injects:
  # ---- Before landfall: 26 Sep (advisories N and N+1) --------------------------------------------------------
  - id: EX-01-MUTUAL-AID-PRAIRIE
    title: "Request 12 mutual-aid line crews from the Prairie Lakes group"
    action_type: mutual_aid_request
    step: D2
    domain: electric
    region: SC-45037
    targets: [STG-EDG-KITEFIELD-YARD]
    params: {crews: 12, headcount: 96, source: "Prairie Lakes mutual aid group (synthetic)", destination_id: STG-EDG-KITEFIELD-YARD}
    known_at: "2024-09-26T06:00:00Z"
    resolved_at: "2024-09-27T00:00:00Z"
    anchor_utc: "2024-09-26T20:00:00Z"
    anchor_label: "Last departure that gets the crews to Kitefield yard before the storm"
    lead_key: mutual_aid_request_processing
    if_late: "The 12 crews arrive a day late and the Edgefield and Aiken restoration starts with local crews only."
    rationale: "The latest advisory keeps the cone over the western Carolinas. Local and contract crews cover about 60% of the expected damage; 12 line crews (96 people) from the Prairie Lakes group need about 10 h on the road. Request them now so they stage at Kitefield yard before the storm arrives."
  - id: EX-02-VEG-CREW-2219
    title: "Pre-stage a vegetation crew on feeder FDR-AIK-2219"
    action_type: stage_crews_small
    step: D2
    domain: electric
    region: SC-45003
    targets: [FDR-AIK-2219]
    params: {crews: 1, crew_type: vegetation, feeder_id: FDR-AIK-2219}
    known_at: "2024-09-26T07:00:00Z"
    resolved_at: "2024-09-26T20:00:00Z"
    anchor_utc: "2024-09-26T20:00:00Z"
    anchor_label: "Tropical-storm winds reach Aiken County"
    lead_key: crew_staging_small
    if_late: "Fallen trees on the hospital feeder wait for the general tree crews after the storm."
    rationale: "Feeder FDR-AIK-2219 serves 3,960 customers and the Tallowbranch hospital line; its trunk runs under old oaks. One vegetation crew staged at the feeder head cuts the clearing time after the storm."
  - id: EX-03-EVENT-TYPE-MAJOR
    title: "Declare a major storm event for the SC and GA service area"
    action_type: set_event_type
    step: D1
    domain: electric
    region: SC-45003
    targets: [SGW-ELECTRIC-TERRITORY]
    params: {event_type: major_storm, previous: elevated_watch}
    known_at: "2024-09-26T08:30:00Z"
    resolved_at: "2024-09-26T21:00:00Z"
    anchor_utc: "2024-09-26T21:00:00Z"
    anchor_label: "First tropical-storm winds in the service area"
    lead_key: event_type_declaration
    if_late: "Storm roles, 16-hour shifts and the storm cost code start only after the first outages."
    rationale: "The forecast now puts tropical-storm winds over most of the service area tonight. A major storm event switches on storm roles, 16-hour shifts and the storm cost code."
  - id: EX-04-HYPOCHLORITE-HOLLOWPINE
    title: "Top up hypochlorite at the Hollowpine water treatment plant"
    action_type: field_resource_order
    step: D3
    domain: water
    region: GA-13245
    targets: [CHM-TERN-2]
    params: {resource_kind: chemical, resource_id: CHM-TERN-2, destination_id: WTP-RCH-HOLLOWPINE, gallons: 3000, hours_on_hand: 84, hours_needed: 168}
    known_at: "2024-09-26T09:00:00Z"
    resolved_at: "2024-09-26T20:00:00Z"
    anchor_utc: "2024-09-26T22:00:00Z"
    anchor_label: "Roads to Hollowpine close in tropical-storm winds"
    lead_key: water_treatment_chemical_delivery
    if_late: "The plant runs out of disinfectant on day 4 if the roads stay closed."
    rationale: "Hollowpine has 3.5 days of hypochlorite on site; the storm plan asks for 7. One 3,000 gal delivery by CHM-TERN-2 before the roads close covers the gap."
  - id: EX-05-STAGE-UPSTATE
    title: "Stage two crews at Reedy Shoals yard for the Upstate"
    action_type: stage_crews_small
    step: D2
    domain: electric
    region: SC-45045
    targets: [STG-GVL-REEDYSHOALS-YARD]
    params: {crews: 2, crew_type: line, destination_id: STG-GVL-REEDYSHOALS-YARD}
    known_at: "2024-09-26T12:00:00Z"
    resolved_at: "2024-09-26T22:00:00Z"
    anchor_utc: "2024-09-27T02:00:00Z"
    anchor_label: "Heavy rain and gusts reach Greenville County"
    lead_key: crew_staging_small
    if_late: "Greenville County starts restoration with no crews staged north of Columbia."
    rationale: "The N+1 track shifts the strongest winds inland toward the Upstate. Two line crews moved from Congaree Bend to Reedy Shoals yard shorten the drive to Greenville feeders after the storm."
  - id: EX-06-SHELTER-GENERATOR
    title: "Pre-stage portable generator MGEN-GANNET-250 at the Thistlecroft shelter"
    action_type: field_resource_order
    step: D3
    domain: electric
    region: SC-45003
    targets: [MGEN-GANNET-250]
    params: {resource_kind: mobile_generator, resource_id: MGEN-GANNET-250, destination_id: SHL-AIK-THISTLECROFT, kw: 250, shelter_capacity: 420}
    known_at: "2024-09-26T13:00:00Z"
    resolved_at: "2024-09-27T02:00:00Z"
    anchor_utc: "2024-09-27T00:00:00Z"
    anchor_label: "The county opens the Thistlecroft shelter"
    lead_key: portable_generator_hookup
    if_late: "420 sheltered residents spend the night without power, cooling or medical device charging."
    rationale: "Aiken County opens Thistlecroft Middle School as a 420-bed shelter at 20:00 ET. The school has no backup power. Stage MGEN-GANNET-250 and connect it before the shelter opens."
  - id: EX-07-DIALYSIS-TANKER
    title: "Put water tanker WTK-SEDGE-4 on standby for the Marrowstone dialysis center"
    action_type: field_resource_order
    step: D3
    domain: water
    region: SC-45003
    targets: [WTK-SEDGE-4]
    params: {resource_kind: potable_water_tanker, resource_id: WTK-SEDGE-4, destination_id: DLY-AIK-MARROWSTONE, tanker_gal: 5500, patients_per_day: 64}
    known_at: "2024-09-26T14:00:00Z"
    resolved_at: "2024-09-27T06:00:00Z"
    anchor_utc: "2024-09-27T04:00:00Z"
    anchor_label: "Pressure in the Copperleaf zone may drop with the power"
    lead_key: potable_water_tanker
    if_late: "64 dialysis patients a day lose treatment if the center's water supply fails."
    rationale: "The Marrowstone dialysis center treats 64 patients a day and needs about 400 gal of potable water an hour. It sits in the Copperleaf zone, which depends on PS-38's generator. A 5,500 gal tanker on standby covers 13 hours."
  - id: EX-08-LIFT-STATION-BUTTONBUSH
    title: "Send portable generator MGEN-SKUA-750 to the Buttonbush Creek lift station"
    action_type: field_resource_order
    step: D3
    domain: water
    region: GA-13245
    targets: [MGEN-SKUA-750]
    params: {resource_kind: mobile_generator, resource_id: MGEN-SKUA-750, destination_id: LS-RCH-BUTTONBUSH-CREEK, kw: 750, wet_well_hours: 3}
    known_at: "2024-09-26T15:00:00Z"
    resolved_at: "2024-09-27T04:00:00Z"
    anchor_utc: "2024-09-27T04:00:00Z"
    anchor_label: "Power to the lift station is expected to go out"
    lead_key: portable_generator_hookup
    terms: [{label: "wet well fills to the overflow level", minutes: 180}]
    if_late: "Sewage overflows into Buttonbush Creek; a state overflow report is due within 24 h."
    rationale: "Buttonbush Creek lift station has no backup generator and its wet well fills in about 3 h without power. Send MGEN-SKUA-750 before the storm so it is hooked up before the outage."
  - id: EX-09-FUEL-DISPATCH-CENTER
    title: "Fill the generator tank at the Flinthollow 911 dispatch center"
    action_type: field_resource_order
    step: D3
    domain: electric
    region: SC-45003
    targets: [FTK-PLOVER-7]
    params: {resource_kind: fuel, resource_id: FTK-PLOVER-7, destination_id: ECC-AIK-FLINTHOLLOW, gallons: 900, tank_hours: 30}
    known_at: "2024-09-26T14:30:00Z"
    resolved_at: "2024-09-27T01:00:00Z"
    anchor_utc: "2024-09-27T01:00:00Z"
    anchor_label: "Tropical-storm winds stop fuel deliveries"
    lead_key: fuel_truck_dispatch
    if_late: "The 911 center starts the storm with a 30-hour tank and no delivery for two days."
    rationale: "The Flinthollow 911 center's generator tank holds 30 hours. Deliveries stop in tropical-storm winds and roads may stay closed for two days. Top it up with 900 gal from FTK-PLOVER-7 now."
  # ---- Morning after landfall: 27 Sep -------------------------------------------------------------------------
  - id: EX-10-EVENT-TYPE-CATASTROPHIC
    title: "Raise the event to catastrophic for Aiken, Richmond and Greenville"
    action_type: set_event_type
    step: D1
    domain: electric
    region: SC-45003
    targets: [SGW-ELECTRIC-TERRITORY]
    params: {event_type: catastrophic, previous: major_storm, counties: 3}
    known_at: "2024-09-27T08:00:00Z"
    resolved_at: "2024-09-27T18:00:00Z"
    anchor_utc: "2024-09-27T18:00:00Z"
    anchor_label: "The state emergency operations center asks for the first restoration plan"
    lead_key: event_type_declaration
    if_late: "Mutual aid and the federal cost tracking start under the wrong event level."
    rationale: "More than half of the customers in Aiken, Richmond and Greenville counties are out and the damage patrols report broken poles on every trunk they reached. A catastrophic event opens the second mutual-aid wave and federal cost tracking."
  - id: EX-11-MUTUAL-AID-SECOND-WAVE
