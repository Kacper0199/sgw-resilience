    known_at: "2024-09-27T07:00:00Z"
    resolved_at: "2024-09-27T20:00:00Z"
    anchor_utc: "2024-09-27T21:00:00Z"
    anchor_label: "Last departure that reaches the day-2 restoration shift"
    lead_key: mutual_aid_request_processing
    if_late: "Day 2 starts with 20 fewer crews; the restoration estimate for Aiken slips by about two days."
    rationale: "Patrols found about 3 times the pole damage the pre-storm plan assumed. The first wave of 12 crews covers Edgefield; Aiken and Richmond need 20 more crews (160 people) for day 2."
  - id: EX-12-STAGE-MILLPOND
    title: "Move three crews to Millpond yard for Augusta"
    action_type: stage_crews_small
