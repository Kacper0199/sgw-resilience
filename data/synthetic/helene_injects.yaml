    known_at: "2024-09-27T10:30:00Z"
    resolved_at: "2024-09-27T23:00:00Z"
    anchor_utc: "2024-09-27T16:00:00Z"
    anchor_label: "Shelter supply run at noon"
    lead_key: silent_outage_patrol
    if_late: "The shelter's food and fuel deliveries drive past live wires."
    rationale: "The sheriff reported 4 lines down on the only road to the Thistlecroft shelter. Draft a patrol work order to make the road safe before the noon supply run."
  - id: EX-15-FUEL-SHELTER
    title: "Refuel MGEN-GANNET-250 at the Thistlecroft shelter"
    action_type: field_resource_order
    step: D3
    domain: electric
    region: SC-45003
    targets: [FTK-PLOVER-7]
    params: {resource_kind: fuel, resource_id: FTK-PLOVER-7, destination_id: SHL-AIK-THISTLECROFT, serves_id: MGEN-GANNET-250, gallons: 300, tank_hours_left: 9}
    known_at: "2024-09-27T10:00:00Z"
    resolved_at: "2024-09-28T02:00:00Z"
    anchor_utc: "2024-09-27T19:00:00Z"
    anchor_label: "MGEN-GANNET-250 runs dry at the current load"
    lead_key: fuel_truck_dispatch
    if_late: "The shelter loses power with 380 residents inside."
    rationale: "MGEN-GANNET-250 has about 9 hours of fuel left at the shelter's load and 380 residents are inside. FTK-PLOVER-7 can bring 300 gal once the road is patrolled."
  - id: EX-16-TANKER-ROSEWILD
    title: "Send water tanker WTK-SEDGE-4 to the Rosewild Pines care home"
    action_type: field_resource_order
    step: D3
    domain: water
    region: SC-45003
    targets: [WTK-SEDGE-4]
    params: {resource_kind: potable_water_tanker, resource_id: WTK-SEDGE-4, destination_id: NRS-AIK-ROSEWILD-PINES, tanker_gal: 5500, residents: 112}
    known_at: "2024-09-27T09:30:00Z"
    resolved_at: "2024-09-28T06:00:00Z"
    anchor_utc: "2024-09-27T18:00:00Z"
    anchor_label: "Care home's stored water runs out"
    lead_key: potable_water_tanker
    if_late: "112 residents run out of drinking water; the care home must evacuate."
    rationale: "Rosewild Pines (112 residents) is in the Laurelspur zone, where pressure is below the state floor. Its stored water lasts until about 14:00 ET. The dialysis center is back on grid power, so WTK-SEDGE-4 is free."
  - id: EX-17-GENERATOR-DISPATCH-CENTER
    title: "Swap the failing generator at the Flinthollow 911 center"
    action_type: field_resource_order
    step: D3
    domain: electric
    region: SC-45003
    targets: [MGEN-SKUA-750]
    params: {resource_kind: mobile_generator, resource_id: MGEN-SKUA-750, destination_id: ECC-AIK-FLINTHOLLOW, from_id: LS-RCH-BUTTONBUSH-CREEK, kw: 750}
    known_at: "2024-09-27T06:00:00Z"
    resolved_at: "2024-09-27T17:00:00Z"
    anchor_utc: "2024-09-27T16:00:00Z"
    anchor_label: "The 911 center's own generator is shut down for repair"
    lead_key: portable_generator_hookup
    if_late: "911 calls roll over to the Barnwell center, 40 minutes away by radio relay."
    rationale: "The Flinthollow 911 center's generator is overheating and must be shut down for repair by noon ET. Buttonbush lift station's feeder is back, so MGEN-SKUA-750 can move to the 911 center."
  - id: EX-18-LIFT-STATION-SWALLOWTAIL
    title: "Draft a bypass-pump work order for the Swallowtail lift station"
    action_type: work_order_draft
