# Helene exercise injects (R33 C3): a master scenario events list (MSEL, HSEEP style) of extra decisions the
# scenario clock raises around the PS-17 story, so every moment of the replay has a realistic decision load for
# command, operations, logistics, water operations and compliance. Everything here is SYNTHETIC: invented
# facilities and resources (D-065 naming rule), scripted times and quantities. Only the storm (NHC HURDAT2 track,
# landfall 2024-09-27 03:10Z) is real. The PS-17 story, its seeded cases and the zone rules are untouched; the
# injects only add decisions next to them.
# Times are UTC. Each inject is raised at `known_at`, is no longer raised after `resolved_at` (the world settled
# it), and its decide-by comes from the clock service: the consequence time (`anchor_utc` plus any `terms`, the time
# from the anchor event until the harm) minus the lead time of `lead_key` (src/sgw/models/clocks/lead_times.yaml).
