  - key: d06
    doc_id: "GEP 2F.01"
    revision: "C"
    status: in_force
    effective: 2024-04-08
    family: annex
    owner_function: logistics
    title: "Flood Annex"
    decisions: [D3]
    facts:
      - {id: d06.f1, text: "Where a fuel route crosses a listed low-water crossing, Logistics pre-delivers fuel at least 24 h before the forecast flooding or assigns an alternate route."}
      - {id: d06.f2, text: "Attachment 2 Low-Water Crossings lists Copperleaf Road (route to PS-38) and Deerwater Spur (route to PS-52) as flood-prone."}
      - {id: d06.f3, text: "Crews do not drive through water over a roadway; road closures are reported to Logistics on F-MAL-030."}

  - key: d07
    doc_id: "DOM 14.206"
    revision: "K"
    status: in_force
    effective: 2024-06-10
    supersedes: "DOM 14.206 Rev J/2 (eff. 2022-06-13)"
    family: sop
    owner_function: planning
    title: "Estimated Time of Restoration (ETR) Development and Release"
    decisions: [D4]
    planted_change: "time limit changed: global ETR due within 36 h of all-clear -> within 24 h"
    facts:
      - {id: d07.f1, text: "The global ETR is the time by which 90 percent of affected customers are restored."}
      - {id: d07.f2, text: "The global ETR is published within 24 h after the all-clear (Rev K; Rev J allowed 36 h)."}
      - {id: d07.f3, text: "The global ETR is stated as a range: P25, P50 and P75."}
      - {id: d07.f4, text: "The ETR Specialist proposes; the Incident Commander and the Duty Manager approve before release."}
      - {id: d07.f5, text: "Regional ETRs follow once damage assessment has patrolled 80 percent of circuits in the region."}
      - {id: d07.f6, text: "A published ETR is revised when the P50 moves by more than 12 h; release wording follows PCN 02.044."}

  - key: d08
    doc_id: "DOM 14.206"
    revision: "J"
    change: 2
    status: superseded
    effective: 2022-06-13
    superseded_by: "DOM 14.206 Rev K (eff. 2024-06-10)"
    family: sop
    owner_function: planning
    title: "Estimated Time of Restoration (ETR) Development and Release"
    decisions: [D4]
    facts:
      - {id: d08.f1, text: "The global ETR is published within 36 h after the all-clear."}
      - {id: d08.f2, text: "Visible line under the title: SUPERSEDED by Rev K, 2024-06-10. Retained for record."}

  - key: d09
    doc_id: "DOM 14.110"
    revision: "H"
    status: in_force
    effective: 2024-03-18
    family: sop
    owner_function: operations
    title: "Damage Assessment and Patrol"
    decisions: [D2, D4]
    facts:
      - {id: d09.f1, text: "Aerial-lift (bucket) work stops when sustained wind exceeds 30 mph."}
      - {id: d09.f2, text: "Patrol order: transmission, substations, feeder trunks serving critical facilities, then laterals."}
      - {id: d09.f3, text: "Damage states are recorded as slight, moderate, extensive or complete on form F-DOM-118."}
      - {id: d09.f4, text: "Damage-assessment photos are queued for review in order of the image-model damage score; a person confirms every damage state."}
    basis: {d09.f1: "family_a.yaml restoration.bucket_limit_sustained_ms (13.4 m/s = 30 mph)"}

  - key: d10
    doc_id: "DOM 14.215"
    revision: "E"
    status: in_force
    effective: 2024-05-06
    family: sop
    owner_function: operations
    title: "Restoration Priority Matrix"
    decisions: [D3, D4]
    facts:
      - {id: d10.f1, text: "Priority 1: hospitals and the water pump stations that supply them; Priority 2: 911 centres, EOCs and shelters; Priority 3: other water and wastewater facilities; Priority 4: remaining feeders by customers restored per crew-hour."}
      - {id: d10.f2, text: "Restoring a feeder that supplies a hospital-zone pump station ahead of a feeder with more customers is a cross-domain priority decision approved by the Incident Commander and the Water Incident Lead."}
      - {id: d10.f3, text: "Attachment A lists FDR-AIK-2207 (supplies PS-17, Tallow Branch hospital zone) as a Priority 1 feeder."}

  - key: d11
    doc_id: "DOM 12.040"
    revision: "D"
    status: in_force
    effective: 2024-06-24
    family: sop
    owner_function: logistics
    title: "Crew Staging and Mutual-Aid Onboarding"
    decisions: [D2]
    facts:
      - {id: d11.f1, text: "Arriving mutual-aid crews receive the onboarding and safety briefing within 4 h of arrival at the staging yard."}
      - {id: d11.f2, text: "The safety briefing covers switching and clearance per TSO 06.110 and Hot Line Hold rules."}
      - {id: d11.f3, text: "Staging yard capacity table: STG-AIK-SANDHILL-YARD 12 crews; STG-RCH-MILLPOND-YARD 9 crews."}
      - {id: d11.f4, text: "Mutual-aid crews check in on ICS 211 at the yard."}

  - key: d12
    doc_id: "MAL 05.012"
    revision: "C"
    status: in_force
    effective: 2024-04-15
    family: sop
    owner_function: logistics
    title: "Mutual Assistance Requests through SEE"
    decisions: [D2]
    facts:
      - {id: d12.f1, text: "A mutual-assistance request states when crews are needed, the number and type of crews, the reporting location, the name and title of the person they report to, the expected duration, the expected weather and the equipment required."}
      - {id: d12.f2, text: "Mutual-assistance requests are approved by the Incident Commander and the Logistics Section Chief before release to SEE."}
      - {id: d12.f3, text: "Planning assumption: median arrival of mutual-aid crews 36 h after the request."}
      - {id: d12.f4, text: "Where SEE procedures conflict with a bilateral agreement, SEE procedures approved by the SEE Mutual Assistance Committee apply."}
    basis: {d12.f3: "numbers.yaml mutual_aid_arrival_median_hours"}

  - key: d13
    doc_id: "MAL 05.040"
    revision: "F"
    status: in_force
    effective: 2024-05-27
    family: sop
    owner_function: logistics
    title: "Fuel and Portable Generator Logistics"
    decisions: [D3]
    facts:
      - {id: d13.f1, text: "Altamaha Fuel & Lube delivers within 18 h of a call during a declared event (contract MAL-CTR-0447)."}
      - {id: d13.f2, text: "Portable generator MGEN-HALBERD-500 (500 kW) is kept at the Graniteville depot DEP-AIK-GRANITEVILLE."}
      - {id: d13.f3, text: "SGW fuel truck FTK-WREN-3 is based at DEP-AIK-GRANITEVILLE; load and drive time is planned at 90 min."}
      - {id: d13.f4, text: "Generator dispatch and fuel requests are made on form F-MAL-022 and logged by Logistics."}
      - {id: d13.f5, text: "Where the vendor delivery time is longer than a generator's remaining run time, the SGW fuel truck is used first."}
    basis: {d13.f3: "family_a.yaml fuel.truck_lead_min"}

  - key: d14
    doc_id: "WDS 03.318"
    legacy_id: "WOP-118"
    revision: "E"
    status: in_force
    effective: 2024-06-03
    family: sop
    owner_function: water_operations
    title: "PS-17 Pellicott Road Booster: Portable Generator Connection"
    decisions: [D3]
    facts:
      - {id: d14.f1, text: "PS-17 has no onsite generator; on loss of grid supply a portable generator is connected."}
      - {id: d14.f2, text: "PS-17 serves pressure zone WZ-PS17-CEDARFALL, which includes Tallow Branch hospital (HSP-AIK-TALLOWBRANCH), and fills tank TNK-PS17-CEDARFALL."}
      - {id: d14.f3, text: "PS-17 is supplied by feeder FDR-AIK-2207."}
      - {id: d14.f4, text: "Portable generator hookup lead time is 150 min from dispatch to pumping (travel, cable connection, manual transfer)."}
      - {id: d14.f5, text: "PS-17 has a manual transfer switch and no automatic transfer switch."}
      - {id: d14.f6, text: "The Water Incident Lead orders the dispatch; the hospital facilities manager is notified when zone pressure falls below 35 psi."}
      - {id: d14.f7, text: "The control box shows the former number: WDS 03.318 (formerly WOP-118)."}
    basis: {d14.f4: "family_a.yaml generator.hookup_lead_min"}

  - key: d15
    doc_id: "WDS 03.322"
    revision: "C"
    status: in_force
    effective: 2024-06-17
    supersedes: "WDS 03.322 Rev B/1 (eff. 2022-07-11)"
    family: sop
    owner_function: water_operations
    title: "Standby Generator Fueling and Run-Time Monitoring"
    decisions: [D3]
