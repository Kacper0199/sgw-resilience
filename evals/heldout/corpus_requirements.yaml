      - {id: d16.f3, text: "Visible line under the title: SUPERSEDED by Rev C, 2024-06-17. Retained for record."}

  - key: d17
    doc_id: "WDS 03.105"
    revision: "G"
    status: in_force
    effective: 2024-02-12
    family: sop
    owner_function: water_operations
    title: "Distribution Pressure Monitoring and Low-Pressure Response"
    decisions: [D3]
    facts:
      - {id: d17.f1, text: "South Carolina systems: minimum 25 psi at service connections in normal operation and 20 psi under heavy flow (SC R.61-58.7.E(7))."}
      - {id: d17.f2, text: "Georgia systems: minimum 20 psi at all times (Ga. Comp. R. & Regs. 391-3-5-.10)."}
      - {id: d17.f3, text: "The SCADA low-pressure alarm is set at 40 psi."}
      - {id: d17.f4, text: "When pressure at a service connection falls below the state minimum, the Water Compliance Officer is notified within 1 h and a boil water evaluation starts under WQC 07.114 (Georgia) or WQC 07.120 (South Carolina)."}
    basis: {d17.f1: "numbers.yaml sc_pressure_floor_psi, sc_pressure_floor_heavy_flow_psi", d17.f2: "numbers.yaml ga_pressure_floor_psi"}

  - key: d18
    doc_id: "WDS 03.240"
    revision: "B"
    status: in_force
    effective: 2024-08-19
    family: sop
    owner_function: water_operations
    title: "Tank Drawdown and Zone Isolation"
    decisions: [D3]
    facts:
      - {id: d18.f1, text: "When a booster station loses power, the zone is served from its elevated tank until the level reaches the residual-pressure limit; the drawdown is tracked every 15 min."}
      - {id: d18.f2, text: "A potable-water tanker to a hospital needs 120 min from request to connection."}
      - {id: d18.f3, text: "Isolation valves are closed only on the Water Incident Lead's order, recorded on F-WDS-212."}
    basis: {d18.f2: "family_a.yaml clocks.hospital_tanker_lead_min"}

  - key: d19
    doc_id: "WQC 07.114"
    revision: "E"
    change: 2
    status: in_force
    effective: 2024-06-03
    supersedes: "WQC 07.114 Rev D/1 (eff. 2022-11-14)"
    family: sop
    owner_function: compliance
    states: [GA]
    title: "Boil Water Advisory: Issuance, Notification and Rescission (Georgia Systems)"
    decisions: [D3]
    planted_change: "rescission sampling tightened: 40 percent of coliform sites -> 50 percent"
    facts:
      - {id: d19.f1, text: "A boil water advisory is issued when pressure falls below 20 psi or system integrity is lost."}
      - {id: d19.f2, text: "The Georgia EPD district inspector is notified; nights and weekends, the Georgia State Emergency Operations Center."}
      - {id: d19.f3, text: "Rescission requires integrity restored, flushing, and samples from at least 50 percent of coliform sample sites (or 15 to 20 samples), all total coliform negative (Rev E; Rev D required 40 percent)."}
      - {id: d19.f4, text: "Rescission may be partial, by zone or street."}
      - {id: d19.f5, text: "The public notice is approved by the Water Incident Lead and the Water Compliance Officer."}
      - {id: d19.f6, text: "The field checklist is F-WQC-031."}

  - key: d20
    doc_id: "WQC 07.114"
    revision: "D"
    change: 1
    status: superseded
    effective: 2022-11-14
    superseded_by: "WQC 07.114 Rev E (eff. 2024-06-03)"
    family: sop
    owner_function: compliance
    states: [GA]
    title: "Boil Water Advisory: Issuance, Notification and Rescission (Georgia Systems)"
    decisions: [D3]
    facts:
      - {id: d20.f1, text: "Rescission requires samples from at least 40 percent of coliform sample sites, all total coliform negative."}
      - {id: d20.f2, text: "Visible line under the title: SUPERSEDED by Rev E, 2024-06-03. Retained for record."}

  - key: d21
