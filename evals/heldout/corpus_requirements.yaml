# Corpus requirements for the procedure corpus (written by the eval author). Every document that a held-out or dev
# item cites is listed here with the facts it must contain. The corpus author writes the documents in the house style of
# the R-CORPUS style guide (ids `<MANUAL> <chapter>.<seq>`, Rev letter / Chg number, control box, footer).
# This is the one held-out file the corpus author reads: it states document content, never the questions asked about it.
# Facts are SGW content for the synthetic corpus (synthetic origin is recorded only in data/corpus/MANIFEST and
# data/ATTRIBUTION.md, never in the documents). Where a fact repeats a value of data/numbers/numbers.yaml or
# data/synthetic/family_a.yaml, the source key is named in `basis` and the document must use the same value.
# A document may contain more than the facts listed; it must not contradict them.
version: 1
style_guide: "synthetic corpus style rules (house style of the SGW document set)"

# The corpus must contain nothing on these topics (the 3 unanswerable copilot questions depend on it).
must_not_mention:
  - id: UNANS-ADDR-ETR
    topic: "estimated restoration times for an individual customer address, premise or account"
  - id: UNANS-COST-RECOVERY
    topic: "SGW's Helene storm-cost recovery amount, rider, or PSC docket number for cost recovery"
  - id: UNANS-PSPS
    topic: "wildfire public safety power shutoff (PSPS) criteria, wind or humidity thresholds for de-energising lines"
  - id: UNANS-VEG-BUDGET
    topic: "SGW vegetation management budget amounts (dev unanswerable item)"

documents:
  - key: d01
    doc_id: "GEP 00.010"
    revision: "G"
    status: in_force
    effective: 2024-05-13
    family: erp_section
    owner_function: command
    title: "Base Emergency Response Plan: Activation, Event Types and Activation Levels"
    decisions: [D1]
    facts:
      - {id: d01.f1, text: "The Incident Commander sets the Event Type; the Duty Manager prepares the recommendation."}
      - {id: d01.f2, text: "Event Type 1 (Catastrophic): projected peak above 35 percent of SGW electric customers out, or projected 90 percent restoration later than 120 h after all-clear."}
      - {id: d01.f3, text: "Event Type 2 (Major): projected peak 15 to 35 percent of customers out, or projected 90 percent restoration 48 to 120 h after all-clear."}
      - {id: d01.f4, text: "Event Type 3 (Significant): 5 to 15 percent, or 24 to 48 h; Event Type 4 (Routine storm): below Type 3."}
      - {id: d01.f5, text: "Activation Levels 5 (Normal) to 1 (Full Activation) describe staffing and are set separately from the Event Type."}
      - {id: d01.f6, text: "While a hurricane watch or warning covers any part of the service area, the Event Type is reviewed after each NHC advisory."}
      - {id: d01.f7, text: "Attachment 3 is the Storm Classification and Staffing Matrix."}

  - key: d02
    doc_id: "GEP 03.020"
    revision: "D"
    status: in_force
    effective: 2024-05-20
    supersedes: "GEP 03.020 Rev C (eff. 2022-04-25)"
    family: erp_section
    owner_function: command
    title: "Storm Organization and ICS Position Descriptions"
    decisions: [D1, D2]
    planted_change: "role renamed: Storm Desk Lead -> Duty Manager (Revision Summary row names it)"
    facts:
      - {id: d02.f1, text: "The Duty Manager (Electric Operations) proposes the Event Type and crew staging plans to the Incident Commander."}
      - {id: d02.f2, text: "The Logistics Section Chief co-approves crew pre-positioning plans and mutual-aid requests with the Incident Commander."}
      - {id: d02.f3, text: "The ETR Specialist sits in the Planning Section and proposes the global ETR."}
      - {id: d02.f4, text: "The Water Incident Lead directs pump-station, tank and portable-generator actions for water systems."}
      - {id: d02.f5, text: "The Water Compliance Officer owns boil water advisory decisions with the Water Incident Lead and is the contact for state drinking-water regulators."}

  - key: d03
    doc_id: "GEP 03.020"
    revision: "C"
    status: superseded
