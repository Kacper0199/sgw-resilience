    superseded_by: "GEP 03.020 Rev D (eff. 2024-05-20)"
    family: erp_section
    owner_function: command
    title: "Storm Organization and ICS Position Descriptions"
    decisions: [D1, D2]
    facts:
      - {id: d03.f1, text: "The Storm Desk Lead proposes the Event Type and crew staging plans to the Incident Commander."}
      - {id: d03.f2, text: "Visible line under the title: SUPERSEDED by Rev D, 2024-05-20. Retained for record."}

  - key: d04
    doc_id: "GEP 2H.01"
    revision: "F"
    status: in_force
    effective: 2024-09-16
    supersedes: "GEP 2H.01 Rev E/1 (eff. 2023-05-30)"
    family: annex
    owner_function: command
    title: "Hurricane Annex"
    decisions: [D1, D2]
    planted_change: "H-hour task moved: mutual-aid request and pre-staging decision H-72 -> H-96"
    facts:
      - {id: d04.f1, text: "Phase table: H-96 Duty Manager and Logistics Section Chief decide the mutual-aid request and the pre-staging plan (moved from H-72 in Rev F)."}
      - {id: d04.f2, text: "Phase table: H-72 pre-staging orders issued; H-48 crews staged outside the forecast 34-kt wind swath; H-24 critical-facility generator readiness checks; H-12 crews sheltered."}
      - {id: d04.f3, text: "A Helene-scale crew pre-positioning plan is approved by the Incident Commander and the Logistics Section Chief."}
      - {id: d04.f4, text: "The approval may set a tolerance band of plus or minus 20 percent of crews per staging site; inside the band the Duty Manager may re-balance without a new approval, outside it the plan returns to both approvers."}
      - {id: d04.f5, text: "Attachment 4 Staging Yard List names STG-AIK-SANDHILL-YARD and STG-RCH-MILLPOND-YARD for the Aiken and Richmond districts."}
    basis: {d04.f4: "numbers.yaml policy_envelope_pct"}

  - key: d05
