      - {id: d15.f2, text: "Fuel level is read and logged every 4 h on F-WDS-207 while a generator runs."}
      - {id: d15.f3, text: "Covered units include GEN-PS38-COPPERLEAF and GEN-PS52-DEERWATER."}

