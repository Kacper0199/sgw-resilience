      - {id: d21.f2, text: "A boil water notice may be written or verbal (SC R.61-58 definition 15)."}
      - {id: d21.f3, text: "The notice ends with: We will provide the next update at: followed by a time."}
      - {id: d21.f4, text: "The notice is approved by the Water Incident Lead and the Water Compliance Officer."}

