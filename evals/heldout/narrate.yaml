# Held-out items for N5 `narrate` and N7 `exec_sitrep`. Input: a K15 evidence bundle (EvidenceRef
# without values) and the phase; the node writes words and slots `{E<n>.<field>}` only.
# Code graders: slot validity (every slot names a ref in the bundle and a field in slot_values), K15
# verify_text finds 0 bare digits, every required_ref is cited, required_order holds (first mention order),
# refs with trust internal_free_text or external are attributed (reported/according to), never stated as fact.
# Judge (J1, calibrated on judge.yaml): clarity and decision focus, 1-4 scale, pass at 3.
# slot_values are what the renderer would fill (illustrative synthetic values unless a truth pointer is given);
# the model never sees them. Asset ids with digits other than PS-17 must be slot-rendered (K15 allowlist). reference_output is one passing
# answer (it passes sgw.contracts.evidence.verify_text and render); it is not the only acceptable wording.
set: narrate
split: heldout
version: 1
items:
  - id: NAR-H-01
    node: narrate
