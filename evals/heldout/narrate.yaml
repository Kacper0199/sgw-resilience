    slot_values:
      E1: {decide_by_utc: "2024-09-27 04:28Z", shift: "76 min earlier"}
      E2: {p50_utc: "2024-09-27 03:40Z"}
      E3: {share: "93%", verdict: "act now"}
      E4: {decide_by_utc: "2024-09-26 23:28Z", site: "STG-AIK-SANDHILL-YARD"}
      E5: {lead_time: "150 min"}
    required_refs: [E1, E3, E4, E5]
    required_order: [E1, E4]
    reference_output: "Advisory N+1 moved the PS-17 clock: decide by {E1.decide_by_utc}, {E1.shift} than at advisory N, because tropical-storm wind now reaches Aiken around {E2.p50_utc}. The portable generator needs {E5.lead_time} from dispatch to pumping, and acting now is not regretted in {E3.share} of forecast scenarios, so the verdict is {E3.verdict}. Crew pre-positioning at {E4.site} sits on the same critical path; decide it by {E4.decide_by_utc}."
