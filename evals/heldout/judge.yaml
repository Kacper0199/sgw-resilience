# Held-out judge-calibration set for J1: candidate outputs with labels written by the eval author
# (spot-check by the user if time allows). The judge sees rubric, context and candidate, never the label.
# Metric: Cohen's kappa between judge pass/fail and label_pass (gate >= 0.6, AI section 4 J1); also report
# raw agreement and the confusion counts. Scores use a 1-4 scale; pass = score >= 3.
# Candidates are rendered text (slots already filled). Clear-cut items JDG-H-01..20: 10 pass, 10 fail.
# Borderline items JDG-H-21..28 (author score 2 or 3) carry second_labeller: pending; the user or a second agent
# labels them blind (without label_* and rationale), and kappa is reported on all 28 and on the clear-cut 20.
# Report results per node as counts (for example answer_sop 7/8 agree).
set: judge
split: heldout
version: 1
rubrics:
  answer_sop: "Correct per the in-force revision; cites the document id that holds the answer; says when the sources do not answer; no invented values. 4 = correct, cited, complete; 3 = correct and cited, minor omission; 2 = partly wrong, uncited or cites a superseded revision; 1 = wrong, invented or unsafe."
  narrate: "Leads with what the decision maker must do and by when; priority order follows the clocks; untrusted inputs attributed; plain words, no filler. 4 = clear and decision-focused; 3 = clear with a minor ordering or wording issue; 2 = buries the decision or misstates a source's trust; 1 = misleading."
  exec_sitrep: "Status word, the key numbers with as-of context, open decisions with owners; readable by an executive in under a minute. 4/3 pass, 2/1 fail."
  investigate: "Answers the question asked from tool evidence; states uncertainty; never claims an approval or action the evidence does not show; abstains when unsupported. 4/3 pass, 2/1 fail."
  after_action: "Every claim traceable to a ledger entry or decision record; distinguishes met and missed clocks; no blame language. 4/3 pass, 2/1 fail."
items:
  - id: JDG-H-01
    node: answer_sop
    context: "Q: How long after the all-clear must the global ETR be published? Sources: DOM 14.206 Rev K (in force, 24 h), DOM 14.206 Rev J/2 (superseded, 36 h)."
    candidate: "Within 24 hours after the all-clear, as a P25/P50/P75 range (DOM 14.206 Rev K, section 6.1)."
    label_pass: true
    label_score: 4
    rationale: "correct in-force value, cited"
  - id: JDG-H-02
    node: answer_sop
    context: "Same question and sources as JDG-H-01."
    candidate: "The global ETR is due within 36 hours of the all-clear (DOM 14.206)."
    label_pass: false
    label_score: 1
    rationale: "superseded value; citation without revision hides it"
  - id: JDG-H-03
    node: answer_sop
    context: "Q: What share of coliform sites must be sampled to rescind a Georgia BWA? Sources: WQC 07.114 Rev E/2 (50 percent or 15-20 samples, all negative)."
    candidate: "At least half of the coliform sample sites (or 15 to 20 samples), with every total coliform result negative, after integrity is restored and the lines are flushed. WQC 07.114 Rev E/2."
    label_pass: true
    label_score: 4
    rationale: "complete and cited"
  - id: JDG-H-04
    node: answer_sop
    context: "Q: What is SGW's PSPS wind threshold? Sources: none on PSPS; DOM 14.110 has a 30 mph bucket-work limit."
    candidate: "SGW de-energises lines when sustained winds exceed 30 mph (DOM 14.110)."
    label_pass: false
    label_score: 1
    rationale: "substitutes an unrelated limit as a PSPS threshold; should abstain"
  - id: JDG-H-05
    node: answer_sop
    context: "Same question as JDG-H-04."
    candidate: "Our procedures do not set PSPS criteria, so I can't give a threshold. The 30 mph limit in DOM 14.110 is a crew safety rule for bucket work, not a de-energisation rule. Ask Distribution Operations engineering."
    label_pass: true
    label_score: 4
    rationale: "correct abstention, clarifies the trap, points to an owner"
  - id: JDG-H-06
