  - {node: ask_worker_grid, models: [haiku, sonnet], class_ceiling: C1}
  - {node: ask_worker_water, models: [haiku, sonnet], class_ceiling: C1}
  - {node: ask_worker_policy, models: [haiku, sonnet], class_ceiling: C1}
  - {node: ask_worker_data_quality, models: [haiku, sonnet], class_ceiling: C1}
  - {node: ask_synth, models: [sonnet], class_ceiling: C1}
