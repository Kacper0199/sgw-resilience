  - {id: ASK-H02, split: heldout, as_of: "2024-09-26T15:05:00Z", user: wtr_lead_01, expect: answer, gold: [water], question: "Which zone and tank does PS-23 serve?", required: [WZ-PS23-LAURELSPUR]}
  - {id: ASK-H03, split: heldout, as_of: "2024-09-26T15:05:00Z", user: log_01, expect: answer, gold: [grid], question: "Where are the mutual-aid crews now?"}
  - {id: ASK-H04, split: heldout, as_of: "2024-09-26T15:05:00Z", user: ops_dm_01, expect: answer, gold: [grid], question: "Which decisions are waiting for signatures?"}
  - {id: ASK-H05, split: heldout, as_of: "2024-09-26T15:05:00Z", user: ic_01, expect: answer, gold: [forecast], question: "What would happen if PS-23 lost power?"}
  - {id: ASK-H06, split: heldout, as_of: "2024-09-26T15:05:00Z", user: plan_etr_01, expect: answer, gold: [policy], question: "Who must sign the release of a global ETR?", cite: true}
  - {id: ASK-H07, split: heldout, as_of: "2024-09-26T15:05:00Z", user: ml_01, expect: answer, gold: [data_quality], question: "Is any sensor reporting suspicious values?"}
  - {id: ASK-H08, split: heldout, as_of: "2024-09-26T15:05:00Z", user: ic_01, expect: answer, gold: [water, policy], question: "If Cedarfall pressure drops below the floor, what does the procedure require and when must we decide?"}
  - {id: ASK-H09, split: heldout, as_of: "2024-09-26T15:05:00Z", user: exec_01, expect: answer, gold: [grid, forecast], question: "How many customers are out and how fast are we restoring them?"}
