[project]
name = "sgw-resilience-platform"
version = "0.1.0"
description = "SGW Resilience Decision Platform: decision queue with computed decide-by clocks for a combined power and water utility"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "httpx",
    "psycopg[binary,pool]>=3.2",
    "langgraph",
    "langgraph-checkpoint-postgres",
    "langchain-core",
    "langchain-anthropic",
    "anthropic",
    "mlflow-skinny",
    "pydantic>=2",
    "pyyaml",
    "jsonschema",
    "rfc8785",
    "cryptography",
    "argon2-cffi",
    "structlog",
    "opentelemetry-sdk",
    "opentelemetry-exporter-otlp",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy",
    "statsmodels",
    "scikit-learn",
    "lightgbm",
    "shap",
    "mapie",
    "lifelines",
    "highspy",
    "ortools",
    "networkx",
    "geopandas",
    "shapely",
    "pyproj",
    "h3",
    "pandera",
    "fastembed",
    "typer",
]

[project.scripts]
sgw = "sgw.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
    "hypothesis",
    "schemathesis",
    "ruff",
    "mypy",
    "matplotlib",
]
host = [
    "wntr>=1.5",
    "six",
    "transformers==5.23.0",
    "torch",
    "torchvision",
    "timm",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sgw", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
markers = ["slow: needs Docker or the network; excluded from check.sh quick"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
