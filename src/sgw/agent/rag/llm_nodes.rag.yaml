# K14 rows for the RAG nodes (schema src/sgw/contracts/llm_nodes.py), kept beside the RAG code. Gateways that
# serve these nodes run with LLM_NODES_FILE pointing here.
version: 1
nodes:
  - node: rag_chunk_header
    model: haiku
    effort: low
    max_tokens: 3000
    prompt_version: v1
    output_schema: sgw.agent.rag.headers.HeadersOut
    class_ceiling: C1
  - node: answer_sop
    model: sonnet
    effort: medium
    max_tokens: 1500
    prompt_version: v3
    citations: true
    class_ceiling: C1
