# Clock-service policy parameters (label A, kind policy; proposed for numbers.yaml as policy_clock_*).
policy:
  advisory_processing_latency_min:
    value: 60
    source: "WP-12 assumption: NHC advisory ingest, clock recompute and duty-manager read before a decision can use it"
  critical_path_tolerance_min:
    value: 1
    source: "WP-12 assumption: clocks are floored to the minute, so a tie within one minute is a tie"
