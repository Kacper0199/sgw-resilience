# Action lead times (SGW policy parameters, label A, synthetic). Proposed for data/numbers/numbers.yaml as
# kind=policy entries `policy_lead_<key>_min` (WP-12 round file, "Root changes needed"); until then this file
# is the single source for the clock service. Values match the WP-06 family-A world so clocks and truth agree.
version: "1.0-synthetic"
