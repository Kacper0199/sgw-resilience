# SGW policy parameters for CE ranking and event typing (label A, kind policy, chip "SGW policy · assumed").
# `policy_ce_weight_hospital` and `policy_equity_weight` are read from data/numbers/numbers.yaml; the rest are
# proposed there as policy_* entries (WP-12 round file, "Root changes needed") and live here until then.
version: "1.0"
critical_facility_weights:
  source: PS DC-52 (CE add-ons per facility)
  values:
    emergency_operations: 2000
    water_treatment_plant: 1000
    wastewater_treatment_plant: 1000
    dialysis: 500
    nursing_home: 500
    shelter: 500
    communications_site: 200
event_types:
  source: PS DC-31 thresholds (assumed, configurable); D-039
  # type: (max predicted peak share of footprint customers out, max predicted hours to 90% restored)
  thresholds:
    - {type: 5, name: Routine, max_peak_share: 0.005, max_t90_h: 12}
    - {type: 4, name: Elevated, max_peak_share: 0.01, max_t90_h: 24}
    - {type: 3, name: Significant, max_peak_share: 0.05, max_t90_h: 48}
    - {type: 2, name: Major, max_peak_share: 0.20, max_t90_h: 120}
    - {type: 1, name: Catastrophic, max_peak_share: null, max_t90_h: null}
analogs:
  source: numbers.yaml peak-out facts (MT A, DS 1.2)
  # Footprint-basis peaks are divided by electric_customers_total and get an implied type. Statewide-basis peaks
  # have no customer denominator in numbers.yaml: they get no implied type, and their distance uses a
  # footprint-equivalent peak scaled by Helene's footprint/statewide ratio (computed, approximate).
  storms:
    - {storm: Helene, year: 2024, peak_key: helene_footprint_peak_out, basis: footprint}
    - {storm: Michael, year: 2018, peak_key: michael_peak_out, basis: sc_ga_statewide}
    - {storm: Ian, year: 2022, peak_key: ian_peak_out, basis: sc_ga_statewide}
  basis_scaling:
    sc_ga_statewide: {numerator_key: helene_footprint_peak_out, denominator_key: helene_statewide_peak_out}
