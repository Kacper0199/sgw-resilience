# WP-39 `obs` profile: technical platform monitoring (D-054). Static targets on the internal `app` network.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]

  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]
    metric_relabel_configs:
      - source_labels: [container_label_com_docker_compose_project]
        regex: sgw
        action: keep
      - source_labels: [container_label_com_docker_compose_service]
        target_label: service
      - regex: container_label_com_docker_compose_(project|service)|id|image|name
        action: labeldrop

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
